<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMK VERESİYE TAKİP PROGRAMI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e3c72;
            color: #fff;
            min-height: 100vh;
        }

        /* GİRİŞ EKRANI */
        #loginScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        .login-card {
            background: #ffffff;
            color: #333;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-card h2 { margin-bottom: 20px; color: #1e3c72; }

        .tab-menu {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-weight: bold;
            cursor: pointer;
            color: #666;
        }

        .tab-btn.active {
            color: #1e3c72;
            border-bottom: 2px solid #1e3c72;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }

        .btn-giris {
            width: 100%;
            padding: 12px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-giris:hover { background: #2a5298; }

        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 10px; }

        /* YÖNETİCİ PANELİ (Sadece müşteri ekleme listeleme) */
        #adminPanel {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f4f6f9;
            color: #333;
            padding: 30px;
            display: none;
            overflow-y: auto;
            z-index: 88888;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2c3e50;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .admin-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .admin-box input { padding: 10px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .admin-table th, .admin-table td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        .admin-table th { background: #f8f9fa; }

        /* ORİJİNAL PROGRAM ARAYÜZÜ (Kullanıcı girişince açılacak alan) */
        #mainApp { display: none; }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ EKRANI (Yönetici veya Müşteri Seçimi) -->
    <div id="loginScreen">
        <div class="login-card">
            <h2>MMK VERESİYE</h2>
            
            <div class="tab-menu">
                <button class="tab-btn active" onclick="tabDegis('yonetici')">Yönetici Girişi</button>
                <button class="tab-btn" onclick="tabDegis('musteri')">Müşteri Girişi</button>
            </div>

            <!-- Yönetici Formu -->
            <div id="formYonetici">
                <div class="form-group">
                    <label>Yönetici E-posta</label>
                    <input type="email" id="admEmail" placeholder="admin@mmk.local">
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="admSifre" placeholder="123456">
                </div>
                <button class="btn-giris" onclick="yoneticiGirisYap()">Yönetici Giriş</button>
                <div id="admHata" class="error-msg"></div>
            </div>

            <!-- Müşteri Formu -->
            <div id="formMusteri" style="display: none;">
                <div class="form-group">
                    <label>Firma E-posta</label>
                    <input type="email" id="musEmail" placeholder="ornek@bakkal.com">
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="musSifre" placeholder="Şifreniz">
                </div>
                <button class="btn-giris" onclick="musteriGirisYap()" style="background: #27ae60;">Programı Aç</button>
                <div id="musHata" class="error-msg"></div>
            </div>
        </div>
    </div>

    <!-- 2. YÖNETİCİ PANELİ (Sadece Müşteri Oluşturma/Silme) -->
    <div id="adminPanel">
        <div class="admin-header">
            <h3>🛠️ MMK Yönetici Paneli</h3>
            <button onclick="cikisYap()" style="background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">Çıkış Yap</button>
        </div>

        <div class="admin-box">
            <h3>Yeni İş Yeri / Müşteri Ekle</h3>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <input type="text" id="yeniFirmaAdi" placeholder="Firma Ünvanı (Örn: Zengin Bakkal)" style="flex: 2;">
                <input type="email" id="yeniEmail" placeholder="E-posta" style="flex: 2;">
                <input type="password" id="yeniSifre" placeholder="Şifre" style="flex: 1;">
                <button onclick="firmaEkle()" style="background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;">Müşteri Ekle</button>
            </div>
            <div id="ekleHata" class="error-msg"></div>
        </div>

        <div class="admin-box">
            <h3>Kayıtlı Müşteri Listesi</h3>
            <div id="musteriListesiDiv">Yükleniyor...</div>
        </div>
    </div>

    <!-- 3. ORİJİNAL PROGRAM ARAYÜZÜ (Kullanıcı Giriş Yapınca Görünecek) -->
    <div id="mainApp">
        <div style="background: #112240; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2a5298;">
            <div>
                <h2 id="programBaslik" style="font-size: 22px; color: #fff;">GÖLBAŞI MARKET</h2>
                <span style="font-size: 12px; color: #a0aec0;">Veresiye Takip Programı</span>
            </div>
            <div>
                <span id="girisYapanFirmaText" style="margin-right: 15px; font-weight: bold;">ZENGİN BAKKAL</span>
                <button onclick="cikisYap()" style="background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">Çıkış</button>
            </div>
        </div>

        <!-- Sizin orijinal programınızın ana arayüz tasarımı buradadır -->
        <div style="padding: 30px;">
            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                <button style="background: #2b6cb0; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer;">📋 CARİ LİSTESİ</button>
                <button style="background: #2d3748; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer;">📦 ÜRÜN YÖNETİMİ</button>
                <button style="background: #2d3748; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer;">🛒 TOPTANCI</button>
            </div>

            <div style="background: #16223a; padding: 25px; border-radius: 8px; border: 1px solid #2a5298;">
                <h3 style="margin-bottom: 10px;">Program Alanı Aktif</h3>
                <p style="color: #cbd5e0;">Bu ekranda müşteriniz kendi verilerini görecek ve yönetecektir.</p>
            </div>
        </div>
    </div>

<script>
const SUPABASE_URL = 'https://pwoiwckcgqkmuqrjymtd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3b2l3Y2tjZ3FrbXVxcmp5bXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MTY0NjcsImV4cCI6MjEwNTM5MjQ2N30.ZenhDupscB8SByf5uFFDX9JxbKS0UOxC2gWJKelwc0I';
const headers = { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

// Sayfa açıldığında hafızada açık oturum var mı bak
window.addEventListener('DOMContentLoaded', () => {
    const admOturum = localStorage.getItem('adm_oturum');
    const musOturum = localStorage.getItem('mus_oturum');

    if (admOturum) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        firmalariGetir();
    } else if (musOturum) {
        const firma = JSON.parse(musOturum);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('programBaslik').textContent = firma.firma_unvani;
        document.getElementById('girisYapanFirmaText').textContent = firma.firma_unvani;
    }
});

function tabDegis(tur) {
    if (tur === 'yonetici') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.querySelectorAll('.tab-btn')[1].classList.remove('active');
        document.getElementById('formYonetici').style.display = 'block';
        document.getElementById('formMusteri').style.display = 'none';
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.querySelectorAll('.tab-btn')[0].classList.remove('active');
        document.getElementById('formMusteri').style.display = 'block';
        document.getElementById('formYonetici').style.display = 'none';
    }
}

// 1. Yönetici Giriş İşlemi
function yoneticiGirisYap() {
    const eposta = document.getElementById('admEmail').value;
    const sifre = document.getElementById('admSifre').value;

    if (eposta === 'admin@mmk.local' && sifre === '123456') {
        localStorage.setItem('adm_oturum', 'true');
        location.reload();
    } else {
        document.getElementById('admHata').textContent = 'Hatalı yönetici bilgileri!';
    }
}

// 2. Müşteri Giriş İşlemi
async function musteriGirisYap() {
    const eposta = document.getElementById('musEmail').value;
    const sifre = document.getElementById('musSifre').value;

    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/isyerleri?eposta=eq.${eposta}&sifre=eq.${sifre}`, { headers });
        const data = await res.json();

        if (data.length === 0) {
            throw new Error('E-posta veya şifre hatalı!');
        }

        localStorage.setItem('mus_oturum', JSON.stringify(data[0]));
        location.reload();
    } catch (err) {
        document.getElementById('musHata').textContent = err.message;
    }
}

// 3. Yönetici Tarafından Müşteri Ekleme
async function firmaEkle() {
    const firma_unvani = document.getElementById('yeniFirmaAdi').value;
    const eposta = document.getElementById('yeniEmail').value;
    const sifre = document.getElementById('yeniSifre').value;

    if (!firma_unvani || !eposta || !sifre) {
        document.getElementById('ekleHata').textContent = 'Tüm alanları doldurun!';
        return;
    }

    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/isyerleri`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ firma_unvani, eposta, sifre })
        });

        if (!res.ok) throw new Error('Kayıt başarısız (Bu e-posta kayıtlı olabilir).');

        document.getElementById('yeniFirmaAdi').value = '';
        document.getElementById('yeniEmail').value = '';
        document.getElementById('yeniSifre').value = '';
        document.getElementById('ekleHata').textContent = '';
        firmalariGetir();
    } catch (err) {
        document.getElementById('ekleHata').textContent = err.message;
    }
}

// 4. Müşterileri Listeleme
async function firmalariGetir() {
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/isyerleri`, { headers });
        const data = await res.json();

        let html = '<table class="admin-table"><thead><tr><th>Firma Ünvanı</th><th>E-posta</th><th>Şifre</th><th>İşlem</th></tr></thead><tbody>';
        data.forEach(f => {
            html += `<tr>
                <td><b>${f.firma_unvani}</b></td>
                <td>${f.eposta}</td>
                <td>${f.sifre}</td>
                <td><button onclick="firmaSil('${f.id}')" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:3px; cursor:pointer;">Sil</button></td>
            </tr>`;
        });
        html += '</tbody></table>';
        if (data.length === 0) html = '<p>Henüz kayıtlı müşteri yok.</p>';

        document.getElementById('musteriListesiDiv').innerHTML = html;
    } catch (err) {
        console.error(err);
    }
}

// 5. Müşteri Silme
async function firmaSil(id) {
    if (!confirm('Silmek istediğinize emin misiniz?')) return;
    await fetch(`${SUPABASE_URL}/rest/v1/isyerleri?id=eq.${id}`, { method: 'DELETE', headers });
    firmalariGetir();
}

// Çıkış Yap
function cikisYap() {
    localStorage.removeItem('adm_oturum');
    localStorage.removeItem('mus_oturum');
    location.reload();
}
</script>

</body>
</html>
