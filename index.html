<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş | MMK Veresiye Takip Programı</title>
<script src="config.js"></script>
<style>
  :root {
    --bg: #0e1a2e; --bg2: #112240; --bg3: #0a1628;
    --panel: #152a4a; --panel2: #1a3358;
    --border: #1e3a5f; --border2: #2a4f7a;
    --blue: #1565c0; --blue2: #1976d2; --blue-bright: #42a5f5; --accent: #2196f3;
    --red: #ef5350; --red2: #e53935;
    --white: #e8f4ff; --text: #cfe2f3; --text-muted: #6a8aaa;
    --input-bg: #0d1e33; --input-border: #1e3a5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg3) 70%);
    color: var(--text);
  }
  .card {
    width: 100%; max-width: 380px; margin: 24px;
    background: var(--panel); border: 1px solid var(--border2); border-radius: 14px;
    padding: 40px 36px 32px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .logo { width: 72px; height: 72px; margin: 0 auto 16px; filter: drop-shadow(0 0 12px rgba(33,150,243,.35)); }
  h1 { margin: 0; font-size: 22px; letter-spacing: 1px; color: var(--white); font-weight: 700; }
  .sub { margin: 4px 0 28px; font-size: 13px; color: var(--text-muted); }
  label { display: block; text-align: left; font-size: 12px; color: var(--text-muted); margin: 0 0 6px; }
  input {
    width: 100%; padding: 12px 14px; margin-bottom: 16px;
    background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px;
    color: var(--white); font-size: 15px; outline: none; transition: border-color .15s;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; padding: 13px; margin-top: 6px;
    background: linear-gradient(135deg, var(--blue2), var(--blue)); border: none; border-radius: 8px;
    color: #fff; font-size: 15px; font-weight: 700; letter-spacing: .5px; cursor: pointer;
    transition: opacity .15s;
  }
  button:disabled { opacity: .6; cursor: default; }
  button:not(:disabled):hover { opacity: .9; }
  .err {
    margin-top: 14px; font-size: 13px; color: var(--red); min-height: 16px;
  }
  .admin-link { margin-top: 22px; font-size: 12px; }
  .admin-link a { color: var(--text-muted); text-decoration: none; }
  .admin-link a:hover { color: var(--blue-bright); }
</style>
</head>

    <h1>MMK VERESİYE</h1>
    <p class="sub">Müşteri Girişi</p>

    <form id="loginForm" novalidate>
      <label for="username">Kullanıcı adı</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" required>

      <label for="password">Parola</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="submitBtn" type="submit">GİRİŞ YAP</button>
      <div id="err" class="err" role="alert"></div>
    </form>

    <div class="admin-link"><a href="admin.html">Yönetici Girişi →</a></div>
  </div>

<script>
  const $ = id => document.getElementById(id);

  function showError(msg) { $('err').textContent = msg; }

  // Zaten geçerli bir müşteri oturumu varsa doğrudan programa gir
  (async () => {
    const s = getSession();
    if (!s || s.role !== 'client' || !s.token) return;
    try {
      const { data } = await sb.rpc('app_validate', { p_token: s.token, p_role: 'client' });
      if (data && data.valid) { location.replace('app.html'); return; }
    } catch {}
    clearSession();
  })();

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    showError('');

    const username = $('username').value.trim();
    const password = $('password').value;
    if (!username || !password) { showError('Kullanıcı adı ve parolayı girin.'); return; }

    const btn = $('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Kontrol ediliyor…';

    try {
      const { data, error } = await sb.rpc('app_login', { p_username: username, p_password: password });
      if (error) throw error;

      if (!data.ok || data.role !== 'client') {
        showError(data.error === 'pending'
          ? 'Hesabınız henüz onaylanmadı. Yönetici onayladıktan sonra giriş yapabilirsiniz.'
          : 'Kullanıcı adı veya parola hatalı.');
        return;
      }

      setSession({ token: data.token, role: 'client', name: data.name });
      location.replace('app.html');
    } catch (err) {
      showError('Sunucuya bağlanılamadı: ' + (err && err.message ? String(err.message).slice(0,160) : 'bilinmeyen hata'));
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = 'GİRİŞ YAP';
    }
  });
</script>
</body>
