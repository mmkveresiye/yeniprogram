<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş | Mmk Veresiye Takip Programı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="text-ink bg-paper">
  <main class="min-h-screen grid lg:grid-cols-[5fr_6fr]">

    <section class="bg-cloth text-white p-8 sm:p-12 lg:p-16 flex flex-col justify-between gap-16">
      <p class="font-display text-2xl tracking-tight">Mmk</p>
      <div>
        <h1 class="font-display text-5xl lg:text-6xl leading-[1.05] font-bold">Veresiye Takip Programı</h1>
        <p class="mt-6 max-w-sm text-white/75 leading-relaxed">
          Müşteri hesaplarınızı, borçları ve tahsilatları tek defterde izleyin.
          Devam etmek için hesabınızla giriş yapın.
        </p>
      </div>
      <p class="text-sm text-white/60">Hesabınız yok mu? Hesap açması için yöneticinizle iletişime geçin.</p>
    </section>

    <section class="ledger-paper flex items-center py-12 pr-6 pl-[88px] sm:pr-12">
      <form id="loginForm" class="w-full max-w-sm" novalidate>
        <h2 class="font-display text-3xl font-bold">Giriş yap</h2>

        <div id="err" role="alert" class="hidden mt-6 rounded-md border border-margin/40 bg-white px-4 py-3 text-sm text-margin"></div>

        <label for="username" class="block mt-6 text-sm font-medium">Kullanıcı adı</label>
        <input id="username" type="text" autocomplete="username" autocapitalize="none" required
               class="mt-1.5 w-full rounded-md border border-rule bg-white px-3.5 py-2.5 focus:border-cloth focus:outline-none focus:ring-2 focus:ring-cloth/30">

        <label for="password" class="block mt-5 text-sm font-medium">Parola</label>
        <input id="password" type="password" autocomplete="current-password" required
               class="mt-1.5 w-full rounded-md border border-rule bg-white px-3.5 py-2.5 focus:border-cloth focus:outline-none focus:ring-2 focus:ring-cloth/30">

        <button id="submitBtn" type="submit"
                class="mt-7 w-full rounded-md bg-cloth px-4 py-3 font-medium text-white hover:bg-clothdk disabled:opacity-60 disabled:cursor-not-allowed">
          Giriş yap
        </button>
      </form>
    </section>
  </main>

<script>
  const $ = id => document.getElementById(id);

  function showError(msg) {
    const el = $('err');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  // Already signed in? Skip the form.
  (async () => {
    const s = getSession();
    if (!s || !s.token) return;
    try {
      const { data } = await sb.rpc('app_validate', { p_token: s.token, p_role: s.role });
      if (data && data.valid) {
        location.replace(s.role === 'admin' ? 'admin.html' : 'app.html');
        return;
      }
    } catch {}
    clearSession();
  })();

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('err').classList.add('hidden');

    const username = $('username').value.trim();
    const password = $('password').value;
    if (!username || !password) { showError('Kullanıcı adı ve parolayı girin.'); return; }

    const btn = $('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Kontrol ediliyor…';

    try {
      const { data, error } = await sb.rpc('app_login', { p_username: username, p_password: password });
      if (error) throw error;

      if (!data.ok) {
        showError(data.error === 'pending'
          ? 'Hesabınız henüz onaylanmadı. Yönetici onayladıktan sonra giriş yapabilirsiniz.'
          : 'Kullanıcı adı veya parola hatalı.');
        return;
      }

      setSession({ token: data.token, role: data.role, name: data.name });
      location.replace(data.role === 'admin' ? 'admin.html' : 'app.html');
    } catch (err) {
      showError('Sunucuya bağlanılamadı. Bağlantınızı ve Supabase ayarlarını kontrol edin.');
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Giriş yap';
    }
  });
</script>
</body>
</html>
