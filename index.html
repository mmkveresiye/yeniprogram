<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMK VERESİYE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* GİRİŞ EKRANI */
        .login-screen {
            display: flex;
            min-height: 100vh;
        }

        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 40px;
            text-align: center;
        }

        .login-right {
            flex: 1;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .login-subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .role-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .role-btn {
            padding: 15px 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .role-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .role-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .login-form {
            display: none;
        }

        .login-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
        }

        .success {
            color: #27ae60;
            font-size: 14px;
            margin-top: 10px;
        }

        /* PANEL EKRANI */
        .panel-screen {
            display: none;
            min-height: 100vh;
            background: #f5f5f5;
        }

        .panel-screen.active {
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar-user {
            font-size: 14px;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .panel-content {
            flex: 1;
            padding: 30px;
        }

        .panel-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #ddd;
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .table th {
            background: #f9f9f9;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }

        .table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .table tr:hover {
            background: #f5f5f5;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-small:hover {
            background: #2980b9;
        }

        .btn-delete {
            background: #e74c3c;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .balance {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
        }

        .balance.positive {
            color: #27ae60;
            background: #e8f8f5;
        }

        .balance.negative {
            color: #e74c3c;
            background: #fadbd8;
        }
    </style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div class="login-screen" id="loginScreen">
    <div class="login-left">
        <div>
            <h1 style="font-size: 48px; margin-bottom: 20px;">👤</h1>
            <h2>MMK VERESİYE</h2>
            <p style="margin-top: 15px; font-size: 14px;">Borç/Alacak Takip Sistemi</p>
        </div>
    </div>

    <div class="login-right">
        <div class="login-title">Giriş Yap</div>
        <div class="login-subtitle">Rol Seç</div>

        <div class="role-buttons">
            <button class="role-btn active" onclick="selectRole('admin')">🔐 Yönetici</button>
            <button class="role-btn" onclick="selectRole('customer')">👤 Müşteri</button>
        </div>

        <!-- ADMIN GİRİŞ -->
        <form class="login-form active" id="adminForm" onsubmit="adminLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="adminEmail" placeholder="admin@mmk.local" required>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="adminPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Giriş Yap</button>
            <div class="error" id="adminError"></div>
        </form>

        <!-- MÜŞTERI GİRİŞ -->
        <form class="login-form" id="customerForm" onsubmit="customerLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="customerEmail" placeholder="musteri@example.com" required>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="customerPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Giriş Yap</button>
            <div class="error" id="customerError"></div>
        </form>
    </div>
</div>

<!-- PANEL EKRANI -->
<div class="panel-screen" id="panelScreen">
    <div class="topbar">
        <div style="font-size: 20px; font-weight: bold;">📊 MMK VERESİYE</div>
        <div>
            <span class="topbar-user" id="userInfo"></span>
            <button class="logout-btn" onclick="logout()">Çıkış</button>
        </div>
    </div>

    <div class="panel-content">
        <!-- ADMIN PANEL -->
        <div id="adminPanel" style="display: none;">
            <div class="panel-title">Yönetici Paneli</div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('customers-tab', this)">👥 Müşteriler</button>
                <button class="tab-btn" onclick="switchTab('stats-tab', this)">📈 İstatistikler</button>
            </div>

            <!-- MÜŞTERILER SEKMESI -->
            <div id="customers-tab" class="tab-content active">
                <div class="card">
                    <h3 style="margin-bottom: 15px;">Yeni Müşteri Ekle</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px;">
                        <input type="number" id="newCustCode" placeholder="Kod" min="1">
                        <input type="text" id="newCustName" placeholder="Müşteri Adı">
                        <input type="email" id="newCustEmail" placeholder="Email">
                        <button class="btn" onclick="addCustomer()" style="width: auto;">Ekle</button>
                    </div>
                    <div id="addCustError" class="error"></div>
                    <div id="addCustSuccess" class="success"></div>
                </div>

                <div class="card">
                    <h3 style="margin-bottom: 15px;">Müşteri Listesi</h3>
                    <div id="customersList" class="loading">Yükleniyor...</div>
                </div>
            </div>

            <!-- İSTATİSTİKLER SEKMESI -->
            <div id="stats-tab" class="tab-content">
                <div class="card">
                    <h3>Genel İstatistikler</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 20px;">
                        <div style="text-align: center; padding: 20px; background: #f0f0f0; border-radius: 8px;">
                            <div style="font-size: 32px; font-weight: bold; color: #667eea;" id="totalCustomers">-</div>
                            <div style="color: #666; margin-top: 10px;">Toplam Müşteri</div>
                        </div>
                        <div style="text-align: center; padding: 20px; background: #f0f0f0; border-radius: 8px;">
                            <div style="font-size: 32px; font-weight: bold; color: #27ae60;" id="totalBalance">-</div>
                            <div style="color: #666; margin-top: 10px;">Toplam Bakiye</div>
                        </div>
                        <div style="text-align: center; padding: 20px; background: #f0f0f0; border-radius: 8px;">
                            <div style="font-size: 32px; font-weight: bold; color: #e74c3c;" id="totalDebt">-</div>
                            <div style="color: #666; margin-top: 10px;">Toplam Borç</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MÜŞTERI PANEL -->
        <div id="customerPanel" style="display: none;">
            <div class="panel-title">Müşteri Paneli</div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('customer-balance-tab', this)">💰 Bakiye</button>
                <button class="tab-btn" onclick="switchTab('customer-trans-tab', this)">📋 İşlemler</button>
            </div>

            <!-- BAKIYE SEKMESI -->
            <div id="customer-balance-tab" class="tab-content active">
                <div class="card">
                    <div class="balance" id="customerBalanceDisplay">Borç: 0 TL</div>
                    
                    <h3 style="margin-bottom: 15px;">İşlem Ekle</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px;">
                        <select id="transType">
                            <option value="borc">Borç</option>
                            <option value="odeme">Ödeme</option>
                        </select>
                        <input type="number" id="transAmount" placeholder="Tutar" step="0.01" min="0">
                        <input type="text" id="transDesc" placeholder="Açıklama (opsiyonel)">
                        <button class="btn" onclick="addTransaction()" style="width: auto;">Ekle</button>
                    </div>
                    <div id="transError" class="error"></div>
                </div>
            </div>

            <!-- İŞLEMLER SEKMESI -->
            <div id="customer-trans-tab" class="tab-content">
                <div class="card">
                    <h3 style="margin-bottom: 15px;">İşlem Geçmişi</h3>
                    <div id="transactionsList" class="loading">Yükleniyor...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <div class="modal-title" id="modalTitle"></div>
        <div id="modalBody"></div>
        <button class="btn" onclick="closeModal()" style="margin-top: 20px;">Kapat</button>
    </div>
</div>

<script>
// ===== SUPABASE KONFİGÜRASYON =====
const SUPABASE_URL = 'https://pwoiwckcgqkmuqrjymtd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3b2l3Y2tjZ3FrbXVxcmp5bXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MTY0NjcsImV4cCI6MjEwNTM5MjQ2N30.ZenhDupscB8SByf5uFFDX9JxbKS0UOxC2gWJKelwc0I';

const headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY
};

// ===== GLOBAL VAR =====
let currentUser = null;
let currentRole = null;
let currentCustomerId = null;

// ===== GİRİŞ FONKSİYONLARI =====
function selectRole(role) {
    document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    document.querySelectorAll('.login-form').forEach(f => f.classList.remove('active'));
    if (role === 'admin') {
        document.getElementById('adminForm').classList.add('active');
    } else {
        document.getElementById('customerForm').classList.add('active');
    }
}

async function adminLogin(e) {
    e.preventDefault();
    const email = document.getElementById('adminEmail').value;
    const password = document.getElementById('adminPassword').value;
    
    try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        
        if (data.error) throw new Error(data.error_description || data.error);
        
        // Profile kontrol et
        const profileRes = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${data.user.id}`, { headers });
        const profiles = await profileRes.json();
        
        if (!profiles[0]?.is_admin) throw new Error('Admin hesabı değilsiniz!');
        
        currentUser = data.user;
        currentRole = 'admin';
        showPanel();
        
    } catch (err) {
        document.getElementById('adminError').textContent = '❌ ' + err.message;
    }
}

async function customerLogin(e) {
    e.preventDefault();
    const email = document.getElementById('customerEmail').value;
    const password = document.getElementById('customerPassword').value;
    
    try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        
        if (data.error) throw new Error(data.error_description || data.error);
        
        // Müşteri kodunu bul
        const profileRes = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${data.user.id}`, { headers });
        const profiles = await profileRes.json();
        
        if (!profiles[0]?.customer_kod) throw new Error('Müşteri kaydı bulunamadı!');
        
        currentUser = data.user;
        currentRole = 'customer';
        currentCustomerId = profiles[0].customer_kod;
        showPanel();
        
    } catch (err) {
        document.getElementById('customerError').textContent = '❌ ' + err.message;
    }
}

function showPanel() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('panelScreen').classList.add('active');
    
    if (currentRole === 'admin') {
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('userInfo').textContent = '👨‍💼 Yönetici • ' + currentUser.email;
        loadCustomers();
    } else {
        document.getElementById('customerPanel').style.display = 'block';
        document.getElementById('userInfo').textContent = '👤 Müşteri • ' + currentUser.email;
        loadCustomerData();
    }
}

// ===== ADMIN FONKSİYONLARI =====
async function addCustomer() {
    const code = parseInt(document.getElementById('newCustCode').value);
    const name = document.getElementById('newCustName').value;
    const email = document.getElementById('newCustEmail').value;
    
    if (!code || !name || !email) {
        document.getElementById('addCustError').textContent = 'Tüm alanlar gerekli!';
        return;
    }
    
    try {
        // Müşteri hesabını oluştur
        const authRes = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ email, password: 'Musteri' + code + '123!' })
        });
        
        const authData = await authRes.json();
        if (authData.error) throw new Error(authData.error_description);
        
        // Müşteri tablosuna ekle
        const custRes = await fetch(`${SUPABASE_URL}/rest/v1/customers`, {
            method: 'POST',
            headers,
            body: JSON.stringify({
                user_id: authData.user.id,
                kod: code,
                unvan: name,
                bakiye: 0
            })
        });
        
        if (!custRes.ok) throw new Error('Müşteri kaydedilemedi');
        
        // Profile ekle
        await fetch(`${SUPABASE_URL}/rest/v1/profiles`, {
            method: 'POST',
            headers,
            body: JSON.stringify({
                id: authData.user.id,
                is_admin: false,
                customer_kod: code
            })
        });
        
        document.getElementById('addCustSuccess').textContent = `✅ ${name} eklendi! Şifre: Musteri${code}123!`;
        document.getElementById('newCustCode').value = '';
        document.getElementById('newCustName').value = '';
        document.getElementById('newCustEmail').value = '';
        document.getElementById('addCustError').textContent = '';
        
        loadCustomers();
        
    } catch (err) {
        document.getElementById('addCustError').textContent = '❌ ' + err.message;
    }
}

async function loadCustomers() {
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/customers`, { headers });
        const customers = await res.json();
        
        let html = '<table class="table"><thead><tr><th>Kod</th><th>Adı</th><th>Bakiye</th><th>İşlem</th></tr></thead><tbody>';
        
        customers.forEach(c => {
            const balanceClass = c.bakiye > 0 ? 'positive' : (c.bakiye < 0 ? 'negative' : '');
            html += `<tr>
                <td>${c.kod}</td>
                <td>${c.unvan}</td>
                <td class="balance ${balanceClass}">${c.bakiye.toFixed(2)} TL</td>
                <td>
                    <button class="btn-small" onclick="viewCustomer(${c.kod})">Göster</button>
                    <button class="btn-small btn-delete" onclick="deleteCustomer(${c.kod})">Sil</button>
                </td>
            </tr>`;
        });
        
        html += '</tbody></table>';
        document.getElementById('customersList').innerHTML = html;
        
        // İstatistikler
        document.getElementById('totalCustomers').textContent = customers.length;
        const totalBalance = customers.reduce((sum, c) => sum + c.bakiye, 0);
        document.getElementById('totalBalance').textContent = totalBalance.toFixed(2) + ' TL';
        document.getElementById('totalDebt').textContent = Math.abs(Math.min(0, totalBalance)).toFixed(2) + ' TL';
        
    } catch (err) {
        console.error(err);
    }
}

async function deleteCustomer(kod) {
    if (!confirm('Müşteri silinecek. Emin misiniz?')) return;
    
    try {
        await fetch(`${SUPABASE_URL}/rest/v1/customers?kod=eq.${kod}`, {
            method: 'DELETE',
            headers
        });
        loadCustomers();
    } catch (err) {
        alert('Hata: ' + err.message);
    }
}

async function viewCustomer(kod) {
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/customers?kod=eq.${kod}`, { headers });
        const [customer] = await res.json();
        
        const transRes = await fetch(`${SUPABASE_URL}/rest/v1/transactions?customer_id=eq.${customer.id}`, { headers });
        const transactions = await transRes.json();
        
        let html = `<p><strong>Müşteri:</strong> ${customer.unvan}</p>
                    <p><strong>Kod:</strong> ${customer.kod}</p>
                    <p><strong>Bakiye:</strong> <span class="balance">${customer.bakiye.toFixed(2)} TL</span></p>
                    <h4 style="margin-top: 20px;">Son İşlemler:</h4>
                    <table class="table">
                    <thead><tr><th>Tür</th><th>Tutar</th><th>Açıklama</th><th>Tarih</th></tr></thead>
                    <tbody>`;
        
        transactions.forEach(t => {
            html += `<tr>
                <td>${t.tur === 'borc' ? '📍 Borç' : '✅ Ödeme'}</td>
                <td>${t.tutar.toFixed(2)} TL</td>
                <td>${t.aciklama || '-'}</td>
                <td>${new Date(t.created_at).toLocaleDateString('tr-TR')}</td>
            </tr>`;
        });
        
        html += '</tbody></table>';
        
        document.getElementById('modalTitle').textContent = customer.unvan;
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('modal').classList.add('active');
        
    } catch (err) {
        alert('Hata: ' + err.message);
    }
}

// ===== MÜŞTERI FONKSİYONLARI =====
async function loadCustomerData() {
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/customers?kod=eq.${currentCustomerId}`, { headers });
        const [customer] = await res.json();
        
        const balanceClass = customer.bakiye > 0 ? 'positive' : (customer.bakiye < 0 ? 'negative' : '');
        const balanceText = customer.bakiye > 0 ? `Alacağı: ${customer.bakiye.toFixed(2)} TL` : `Borcu: ${Math.abs(customer.bakiye).toFixed(2)} TL`;
        
        document.getElementById('customerBalanceDisplay').innerHTML = balanceText;
        document.getElementById('customerBalanceDisplay').className = 'balance ' + balanceClass;
        
        loadTransactions();
        
    } catch (err) {
        console.error(err);
    }
}

async function addTransaction() {
    const type = document.getElementById('transType').value;
    const amount = parseFloat(document.getElementById('transAmount').value);
    const desc = document.getElementById('transDesc').value;
    
    if (!amount || amount <= 0) {
        document.getElementById('transError').textContent = 'Geçerli tutar girin!';
        return;
    }
    
    try {
        const custRes = await fetch(`${SUPABASE_URL}/rest/v1/customers?kod=eq.${currentCustomerId}`, { headers });
        const [customer] = await custRes.json();
        
        // İşlem ekle
        await fetch(`${SUPABASE_URL}/rest/v1/transactions`, {
            method: 'POST',
            headers,
            body: JSON.stringify({
                customer_id: customer.id,
                tur: type,
                tutar: amount,
                aciklama: desc
            })
        });
        
        // Bakiyeyi güncelle
        const newBalance = type === 'borc' ? customer.bakiye - amount : customer.bakiye + amount;
        
        await fetch(`${SUPABASE_URL}/rest/v1/customers?kod=eq.${currentCustomerId}`, {
            method: 'PATCH',
            headers,
            body: JSON.stringify({ bakiye: newBalance })
        });
        
        document.getElementById('transAmount').value = '';
        document.getElementById('transDesc').value = '';
        document.getElementById('transError').textContent = '';
        
        loadCustomerData();
        
    } catch (err) {
        document.getElementById('transError').textContent = '❌ ' + err.message;
    }
}

async function loadTransactions() {
    try {
        const custRes = await fetch(`${SUPABASE_URL}/rest/v1/customers?kod=eq.${currentCustomerId}`, { headers });
        const [customer] = await custRes.json();
        
        const res = await fetch(`${SUPABASE_URL}/rest/v1/transactions?customer_id=eq.${customer.id}&order=created_at.desc`, { headers });
        const transactions = await res.json();
        
        let html = '<table class="table"><thead><tr><th>Tür</th><th>Tutar</th><th>Açıklama</th><th>Tarih</th></tr></thead><tbody>';
        
        transactions.forEach(t => {
            html += `<tr>
                <td>${t.tur === 'borc' ? '📍 Borç' : '✅ Ödeme'}</td>
                <td>${t.tutar.toFixed(2)} TL</td>
                <td>${t.aciklama || '-'}</td>
                <td>${new Date(t.created_at).toLocaleDateString('tr-TR', { hour: '2-digit', minute: '2-digit' })}</td>
            </tr>`;
        });
        
        html += '</tbody></table>';
        if (transactions.length === 0) html = '<p style="text-align: center; color: #999;">Henüz işlem yok</p>';
        
        document.getElementById('transactionsList').innerHTML = html;
        
    } catch (err) {
        console.error(err);
    }
}

// ===== GENEL FONKSİYONLAR =====
function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
}

function logout() {
    currentUser = null;
    currentRole = null;
    currentCustomerId = null;
    
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('panelScreen').classList.remove('active');
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('customerPanel').style.display = 'none';
    
    document.getElementById('adminEmail').value = '';
    document.getElementById('adminPassword').value = '';
    document.getElementById('customerEmail').value = '';
    document.getElementById('customerPassword').value = '';
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
}
