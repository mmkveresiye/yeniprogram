<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMK VERESİYE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* GİRİŞ EKRANI */
        .login-screen {
            display: flex;
            min-height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .login-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            text-align: center;
        }

        .login-subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        /* PANEL EKRANI */
        .panel-screen {
            display: none;
            min-height: 100vh;
            width: 100vw;
            background: #f5f5f5;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
        }

        .panel-screen.active {
            display: flex;
        }

        .topbar {
            background: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar-user {
            font-size: 14px;
            margin-right: 15px;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .panel-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #ddd;
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .table th {
            background: #f9f9f9;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }

        .table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .table tr:hover {
            background: #f5f5f5;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-small:hover {
            background: #2980b9;
        }

        .btn-delete {
            background: #e74c3c;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .balance {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
        }

        .balance.positive { color: #27ae60; background: #e8f8f5; }
        .balance.negative { color: #e74c3c; background: #fadbd8; }
    </style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <div class="login-title">MMK VERESİYE</div>
        <div class="login-subtitle">İş Yeri Giriş Paneli</div>

        <form id="loginForm" onsubmit="isyeriGirisYap(event)">
            <div class="form-group">
                <label>İş Yeri E-posta</label>
                <input type="email" id="loginEmail" placeholder="isyeri@mmk.local" required>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Giriş Yap</button>
            <div class="error" id="loginError"></div>
        </form>
    </div>
</div>

<!-- PANEL EKRANI -->
<div class="panel-screen" id="panelScreen">
    <div class="topbar">
        <div style="font-size: 20px; font-weight: bold;">📊 MMK VERESİYE TAKİP</div>
        <div>
            <span class="topbar-user" id="userInfo"></span>
            <button class="logout-btn" onclick="logout()">Çıkış</button>
        </div>
    </div>

    <div class="panel-content">
        <div id="adminPanel">
            <div class="panel-title" id="firmaBaslik">Yönetici Paneli</div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('customers-tab', this)">👥 Müşteriler</button>
                <button class="tab-btn" onclick="switchTab('stats-tab', this)">📈 İstatistikler</button>
            </div>

            <!-- MÜŞTERILER SEKMESI -->
            <div id="customers-tab" class="tab-content active">
                <div class="card">
                    <h3 style="margin-bottom: 15px;">Yeni Müşteri Ekle</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px;">
                        <input type="number" id="newCustCode" placeholder="Kod" min="1">
                        <input type="text" id="newCustName" placeholder="Müşteri Adı">
                        <input type="text" id="newCustTelefon" placeholder="Telefon">
                        <button class="btn" onclick="addCustomer()" style="width: auto;">Ekle</button>
                    </div>
                    <div id="addCustError" class="error"></div>
                </div>

                <div class="card">
                    <h3 style="margin-bottom: 15px;">Müşteri Listesi</h3>
                    <div id="customersList" class="loading">Yükleniyor...</div>
                </div>
            </div>

            <!-- İSTATİSTİKLER SEKMESI -->
            <div id="stats-tab" class="tab-content">
                <div class="card">
                    <h3>Genel İstatistikler</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 20px;">
                        <div style="text-align: center; padding: 20px; background: #f0f0f0; border-radius: 8px;">
                            <div style="font-size: 32px; font-weight: bold; color: #667eea;" id="totalCustomers">-</div>
                            <div style="color: #666; margin-top: 10px;">Toplam Müşteri</div>
                        </div>
                        <div style="text-align: center; padding: 20px; background: #f0f0f0; border-radius: 8px;">
                            <div style="font-size: 32px; font-weight: bold; color: #27ae60;" id="totalBalance">-</div>
                            <div style="color: #666; margin-top: 10px;">Toplam Bakiye</div>
                        </div>
                        <div style="text-align: center; padding: 20px; background: #f0f0f0; border-radius: 8px;">
                            <div style="font-size: 32px; font-weight: bold; color: #e74c3c;" id="totalDebt">-</div>
                            <div style="color: #666; margin-top: 10px;">Toplam Borç</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL (Müşteri Detay / İşlem Ekleme) -->
<div class="modal" id="modal">
    <div class="modal-content">
        <div class="modal-title" id="modalTitle">Müşteri Detayı</div>
        <div id="modalBody"></div>
        <button class="btn" onclick="closeModal()" style="margin-top: 20px; background: #95a5a6;">Kapat</button>
    </div>
</div>

<script>
// ===== SUPABASE KONFİGÜRASYON =====
const SUPABASE_URL = 'https://pwoiwckcgqkmuqrjymtd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3b2l3Y2tjZ3FrbXVxcmp5bXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MTY0NjcsImV4cCI6MjEwNTM5MjQ2N30.ZenhDupscB8SByf5uFFDX9JxbKS0UOxC2gWJKelwc0I';

const headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY
};

// ===== GLOBAL DEĞİŞKENLER =====
let aktifIsyeri = null;

// Sayfa açıldığında hafızada oturum var mı kontrol et
window.addEventListener('DOMContentLoaded', () => {
    const kaydedilenFirma = localStorage.getItem('aktif_isyeri');
    if (kaydedilenFirma) {
        aktifIsyeri = JSON.parse(kaydedilenFirma);
        panelGoster();
    }
});

// ===== GİRİŞ İŞLEMLERİ =====
async function isyeriGirisYap(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const sifre = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('loginError');

    try {
        // isyerleri tablosundan firmayı sorgula
        const res = await fetch(`${SUPABASE_URL}/rest/v1/isyerleri?eposta=eq.${email}&sifre=eq.${sifre}`, { headers });
        const data = await res.json();

        if (data.length === 0) {
            throw new Error('E-posta veya şifre hatalı!');
        }

        aktifIsyeri = data[0];
        localStorage.setItem('aktif_isyeri', JSON.stringify(aktifIsyeri));
        
        panelGoster();
    } catch (err) {
        errorDiv.textContent = '❌ ' + err.message;
    }
}

function panelGoster() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('panelScreen').classList.add('active');
    document.getElementById('userInfo').textContent = `🏢 ${aktifIsyeri.firma_unvani} (${aktifIsyeri.eposta})`;
    document.getElementById('firmaBaslik').textContent = aktifIsyeri.firma_unvani + " - Müşteri Yönetimi";
    
    loadCustomers();
}

function logout() {
    localStorage.removeItem('aktif_isyeri');
    aktifIsyeri = null;
    document.getElementById('panelScreen').classList.remove('active');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginError').textContent = '';
}

// ===== MÜŞTERİ YÖNETİMİ (isyeri_id Filtreli) =====
async function loadCustomers() {
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/customers?isyeri_id=eq.${aktifIsyeri.id}`, { headers });
        const customers = await res.json();
        
        let html = '<table class="table"><thead><tr><th>Kod</th><th>Adı</th><th>Telefon</th><th>Bakiye</th><th>İşlem</th></tr></thead><tbody>';
        
        customers.forEach(c => {
            const balanceClass = c.bakiye > 0 ? 'positive' : (c.bakiye < 0 ? 'negative' : '');
            html += `<tr>
                <td>${c.kod}</td>
                <td>${c.unvan}</td>
                <td>${c.telefon || '-'}</td>
                <td class="balance ${balanceClass}" style="padding: 5px; font-size: 14px;">${c.bakiye.toFixed(2)} TL</td>
                <td>
                    <button class="btn-small" onclick="viewCustomer('${c.id}')">Detay / İşlem</button>
                    <button class="btn-small btn-delete" onclick="deleteCustomer('${c.id}')">Sil</button>
                </td>
            </tr>`;
        });
        
        html += '</tbody></table>';
        if (customers.length === 0) html = '<p style="text-align: center; color: #999;">Henüz kayıtlı müşteri yok.</p>';
        
        document.getElementById('customersList').innerHTML = html;
        
        // İstatistikleri Güncelle
        document.getElementById('totalCustomers').textContent = customers.length;
        const totalBalance = customers.reduce((sum, c) => sum + c.bakiye, 0);
        document.getElementById('totalBalance').textContent = totalBalance.toFixed(2) + ' TL';
        document.getElementById('totalDebt').textContent = Math.abs(Math.min(0, totalBalance)).toFixed(2) + ' TL';
        
    } catch (err) {
        console.error(err);
    }
}

async function addCustomer() {
    const code = parseInt(document.getElementById('newCustCode').value);
    const name = document.getElementById('newCustName').value;
    const telefon = document.getElementById('newCustTelefon').value;
    const errDiv = document.getElementById('addCustError');
    
    if (!code || !name) {
        errDiv.textContent = 'Kod ve Müşteri Adı zorunludur!';
        return;
    }
    
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/customers`, {
            method: 'POST',
            headers,
            body: JSON.stringify({
                isyeri_id: aktifIsyeri.id,
                kod: code,
                unvan: name,
                telefon: telefon,
                bakiye: 0
            })
        });
        
        if (!res.ok) throw new Error('Müşteri eklenirken hata oluştu.');
        
        document.getElementById('newCustCode').value = '';
        document.getElementById('newCustName').value = '';
        document.getElementById('newCustTelefon').value = '';
        errDiv.textContent = '';
        
        loadCustomers();
    } catch (err) {
        errDiv.textContent = '❌ ' + err.message;
    }
}

async function deleteCustomer(id) {
    if (!confirm('Müşteri ve tüm hareketleri silinecek. Emin misiniz?')) return;
    
    try {
        await fetch(`${SUPABASE_URL}/rest/v1/customers?id=eq.${id}`, {
            method: 'DELETE',
            headers
        });
        loadCustomers();
    } catch (err) {
        alert('Hata: ' + err.message);
    }
}

// Müşteri Detay ve İşlem Ekleme Ekranı
async function viewCustomer(customerId) {
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/customers?id=eq.${customerId}`, { headers });
        const [customer] = await res.json();
        
        const transRes = await fetch(`${SUPABASE_URL}/rest/v1/transactions?customer_id=eq.${customer.id}&order=created_at.desc`, { headers });
        const transactions = await transRes.json();
        
        let html = `
            <p><strong>Müşteri:</strong> ${customer.unvan}</p>
            <p><strong>Kod:</strong> ${customer.kod}</p>
            <p style="margin-bottom: 15px;"><strong>Bakiye:</strong> <span class="balance" style="font-size:14px; padding:5px;">${customer.bakiye.toFixed(2)} TL</span></p>
            
            <hr style="margin: 15px 0; border:0; border-top:1px solid #ddd;">
            
            <h4 style="margin-bottom: 10px;">İşlem Ekle (Borç / Ödeme)</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;">
                <select id="modalTransType" style="padding:8px;">
                    <option value="borc">Borçlandır (+)</option>
                    <option value="odeme">Ödeme Al (-)</option>
                </select>
                <input type="number" id="modalTransAmount" placeholder="Tutar (TL)" step="0.01" style="padding:8px;">
            </div>
            <input type="text" id="modalTransDesc" placeholder="Açıklama (Opsiyonel)" style="width:100%; padding:8px; margin-bottom: 10px;">
            <button class="btn" onclick="addTransaction('${customer.id}')" style="padding:8px;">İşlemi Kaydet</button>
            
            <h4 style="margin-top: 20px; margin-bottom: 10px;">İşlem Geçmişi</h4>
            <div style="max-height: 200px; overflow-y: auto;">
                <table class="table" style="margin-top:0;">
                    <thead><tr><th>Tür</th><th>Tutar</th><th>Açıklama</th><th>Tarih</th></tr></thead>
                    <tbody>`;
        
        transactions.forEach(t => {
            html += `<tr>
                <td>${t.tur === 'borc' ? '📍 Borç' : '✅ Ödeme'}</td>
                <td>${t.tutar.toFixed(2)} TL</td>
                <td>${t.aciklama || '-'}</td>
                <td>${new Date(t.created_at).toLocaleDateString('tr-TR')}</td>
            </tr>`;
        });
        
        html += `</tbody></table></div>`;
        if (transactions.length === 0) html += '<p style="text-align: center; color: #999; margin-top:10px;">Henüz işlem yok.</p>';
        
        document.getElementById('modalTitle').textContent = customer.unvan;
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('modal').classList.add('active');
        
    } catch (err) {
        alert('Hata: ' + err.message);
    }
}

async function addTransaction(customerId) {
    const type = document.getElementById('modalTransType').value;
    const amount = parseFloat(document.getElementById('modalTransAmount').value);
    const desc = document.getElementById('modalTransDesc').value;
    
    if (!amount || amount <= 0) {
        alert('Geçerli bir tutar girin!');
        return;
    }
    
    try {
        const custRes = await fetch(`${SUPABASE_URL}/rest/v1/customers?id=eq.${customerId}`, { headers });
        const [customer] = await custRes.json();
        
        // İşlem tablosuna ekle
        await fetch(`${SUPABASE_URL}/rest/v1/transactions`, {
            method: 'POST',
            headers,
            body: JSON.stringify({
                customer_id: customer.id,
                tur: type,
                tutar: amount,
                aciklama: desc
            })
        });
        
        // Bakiyeyi güncelle
        const newBalance = type === 'borc' ? customer.bakiye + amount : customer.bakiye - amount;
        
        await fetch(`${SUPABASE_URL}/rest/v1/customers?id=eq.${customerId}`, {
            method: 'PATCH',
            headers,
            body: JSON.stringify({ bakiye: newBalance })
        });
        
        viewCustomer(customerId); // Modalı yenile
        loadCustomers(); // Arka plandaki listeyi güncelle
        
    } catch (err) {
        alert('Hata: ' + err.message);
    }
}

// ===== GENEL YARDIMCILAR =====
function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').finally;
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
    loadCustomers();
}
</script>

</body>
</html>
